<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap Sim</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a; --card: #141414; --line: #262626; --text: #ededed; --dim: #8a8a8a; --faint: #4a4a4a;
    --soft: #1b1b1b; --accent: #ededed; --mint: #7cf0c8; --radius: 20px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { height: 56px; padding: 0 24px; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); }
  header .model { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 16px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card h2 { margin: 0; padding: 10px 12px 10px 20px; min-height: 53px; font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .card h2 span { flex: 1; }
  .body { flex: 1; min-height: 0; position: relative; }
  [hidden] { display: none !important; }

  #sim { width: 100%; height: 100%; border: 0; display: block; background: var(--card); opacity: 1; transition: opacity .5s; }
  #sim.fade { opacity: 0; }
  #sim:not([srcdoc]) { visibility: hidden; }
  #loader { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 22px; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; pointer-events: none; transition: opacity .4s; }
  #loader.off { opacity: 0; }
  #toss { width: min(280px, 100%); aspect-ratio: 280 / 120; display: block; }
  #toss.calm { animation: breathe 1.6s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: .45; } }

  ::selection { background: rgba(124, 240, 200, .25); }
  button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 18px; font: inherit; font-weight: 500; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--faint); }
  button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }
  button.small { padding: 5px 14px; font-size: 13px; }
  button:disabled { opacity: .4; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
  .chips button { padding: 5px 12px; font-size: 13px; font-weight: 400; color: var(--dim); background: transparent; }
  .chips button:hover { color: var(--text); }

  .chat { height: 100%; display: flex; flex-direction: column; }
  #thread { flex: 1; min-height: 0; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 88%; white-space: pre-wrap; word-wrap: break-word; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .msg.user { align-self: flex-end; background: var(--soft); border: 1px solid var(--line); padding: 10px 14px; border-radius: 16px; }
  .msg.model { align-self: flex-start; padding-left: 2px; white-space: normal; width: 88%; }
  .msg.model p { margin: 0 0 8px; }
  .msg.model .eq .katex-display { margin: 6px 0 10px; }
  .step { position: relative; margin-top: 14px; padding-left: 34px; }
  .step::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 1px; background: var(--line); }
  .step:last-child::before { display: none; }
  .step-h { display: flex; align-items: center; gap: 10px; margin: 0 0 6px -34px; font-weight: 600; }
  .step-n { flex: none; width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--bg); background: var(--text); font-variant-numeric: tabular-nums; }
  .step:last-child .step-n { background: var(--mint); }
  .msg.sys { align-self: center; color: var(--dim); font-size: 12px; }
  .msg img { display: block; max-width: 100%; max-height: 220px; border-radius: 10px; margin-bottom: 8px; }
  .msg .katex { font-size: 1.08em; }
  .msg .katex-display { margin: 10px 0 4px; padding: 16px 18px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; overflow-y: hidden; white-space: normal; }
  .msg .katex-display > .katex { text-align: left; }
  /* KaTeX writes TeX spacing inline: 0.2778em around relations (=), 0.2222em around binary ops (×). */
  .msg .katex .mspace[style*="0.2778em"] { margin-right: .5em !important; }
  .msg .katex .mspace[style*="0.2222em"] { margin-right: .4em !important; }
  .meta { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .bar { padding: 0 16px 16px; }
  .composer { background: var(--soft); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; transition: border-color .2s; }
  .composer:focus-within { border-color: #3a3a3a; }
  .composer.over { border-color: var(--mint); }
  #msg { width: 100%; min-height: 48px; max-height: 200px; resize: none; background: none; color: var(--text); border: 0; padding: 4px 6px; font: inherit; outline: none; }
  #msg::placeholder { color: var(--dim); }
  .tray { display: flex; align-items: center; gap: 8px; }
  .chat.on .composer { flex-direction: row; align-items: flex-end; padding: 8px 8px 8px 10px; }
  .chat.on #msg { min-height: 36px; padding: 7px 6px; }
  #send { margin-left: auto; }
  .attach { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 10px; font-size: 13px; font-weight: 400; color: var(--dim); background: transparent; }
  .attach:hover { color: var(--text); }
  .attach svg { width: 16px; height: 16px; }
  .thumb { position: relative; align-self: flex-start; margin: 2px 2px 0; }
  .thumb img { display: block; height: 72px; max-width: 200px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .thumb button { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; padding: 0; display: grid; place-items: center; background: var(--card); color: var(--dim); }
  .thumb button:hover { color: var(--text); }
  .thumb svg { width: 10px; height: 10px; }

  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; grid-auto-rows: minmax(480px, 1fr); } body { height: auto; } }
</style>
</head>
<body>
<header><i class="dot"></i>Snap Sim<span class="model" id="model"></span></header>
<div class="grid">
  <section class="card">
    <h2><span>Problem</span><button id="new" class="small" hidden>New</button></h2>
    <div class="body">
      <div id="chat" class="chat">
        <div id="thread"></div>
        <div class="chips" id="chips"></div>
        <div class="bar">
          <div class="composer" id="composer">
            <div class="thumb" id="thumb" hidden>
              <img alt="">
              <button id="unattach" aria-label="Remove photo"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></button>
            </div>
            <textarea id="msg" rows="2" placeholder="Problem text"></textarea>
            <div class="tray">
              <button id="attach" class="attach"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="1.5" y="3.5" width="13" height="10" rx="2"/><path d="M5.5 3.5l1-2h3l1 2"/><circle cx="8" cy="8.5" r="2.5"/></svg>Photo</button>
              <button id="send" class="primary">Build</button>
            </div>
          </div>
          <input id="file" type="file" accept="image/*" capture="environment" hidden>
        </div>
      </div>
    </div>
  </section>
  <section class="card">
    <h2><span>Simulation</span><button id="code" class="small" disabled>Code</button></h2>
    <div class="body">
      <iframe id="sim" sandbox="allow-scripts"></iframe>
      <div id="loader" class="off"><canvas id="toss"></canvas><span id="loadtime"></span></div>
    </div>
  </section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const MARK = "@@SCENE@@";
  const MAX_FIXES = 2;
  let image = null, problem = "", scene = "", chat = [], busy = false, fixes = 0, lastModel = null, started = false;

  fetch("/api/meta").then((r) => r.json()).then((m) => ($("model").textContent = m.model));

  function setImage(src) {
    image = src;
    const img = $("thumb").querySelector("img");
    src ? (img.src = src) : img.removeAttribute("src");
    $("thumb").hidden = !src;
  }
  function readFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = () => setImage(r.result);
    r.readAsDataURL(file);
  }

  // Before the first message the composer takes a photo; after it, the thread is a plain chat.
  function setStarted(on) {
    started = on;
    $("attach").hidden = on; $("chips").hidden = on; $("new").hidden = !on;
    if (on) $("thumb").hidden = true;
    $("chat").classList.toggle("on", on);
    $("msg").rows = on ? 1 : 2;
    $("msg").placeholder = on ? "Message Argon" : "Problem text";
    $("send").textContent = on ? "Send" : "Build";
    grow();
  }

  $("attach").onclick = () => $("file").click();
  $("unattach").onclick = () => { setImage(null); $("file").value = ""; };
  $("file").onchange = (e) => readFile(e.target.files[0]);
  const drag = (on) => (e) => { e.preventDefault(); $("composer").classList.toggle("over", on && !started); };
  $("chat").ondragover = drag(true);
  $("chat").ondragleave = drag(false);
  $("chat").ondrop = (e) => { drag(false)(e); if (!started) readFile(e.dataTransfer.files[0]); };
  window.onpaste = (e) => {
    if (started) return;
    const f = [...e.clipboardData.files].find((f) => f.type.startsWith("image/"));
    if (f) readFile(f);
  };

  fetch("/api/examples").then((r) => r.json()).then((list) => {
    for (const ex of list) {
      const b = document.createElement("button");
      b.textContent = ex.title;
      b.onclick = () => { if (busy) return; setImage(ex.image); $("msg").value = ""; grow(); start(ex.text || ""); };
      $("chips").append(b);
    }
  });

  function bubble(role, text, img) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    if (img) { const i = document.createElement("img"); i.src = img; el.append(i); }
    const t = document.createElement("span"); t.textContent = text; el.append(t);
    const meta = document.createElement("span"); meta.className = "meta"; el.append(meta);
    $("thread").append(el);
    $("thread").scrollTop = $("thread").scrollHeight;
    return { el, text: t, meta };
  }

  const MATH = { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "\\[", right: "\\]", display: true }, { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false }], throwOnError: false };
  // Reply layout: "Step N: title" lines become step headings, $$...$$ blocks become equation rows, other lines are paragraphs.
  function setReply(span, text) {
    span.innerHTML = "";
    let step = null;
    const target = () => step || span;
    for (const part of text.split(/(\$\$[\s\S]*?\$\$)/)) {
      if (part.startsWith("$$") && part.endsWith("$$") && part.length > 4) {
        const eq = document.createElement("div"); eq.className = "eq"; eq.textContent = part;
        target().append(eq);
        continue;
      }
      for (const line of part.split("\n")) {
        const l = line.trim();
        if (!l) continue;
        const m = /^Step\s+(\d+)\s*[:.\-–—]\s*(.*)$/i.exec(l);
        if (m) {
          step = document.createElement("div"); step.className = "step";
          const h = document.createElement("div"); h.className = "step-h";
          const n = document.createElement("span"); n.className = "step-n"; n.textContent = m[1];
          const t = document.createElement("span"); t.textContent = m[2];
          h.append(n, t); step.append(h); span.append(step);
          continue;
        }
        const p = document.createElement("p"); p.textContent = l;
        target().append(p);
      }
    }
    if (window.renderMathInElement) renderMathInElement(span, MATH);
  }

  function split(raw) {
    const k = raw.indexOf(MARK);
    if (k >= 0) return { reply: raw.slice(0, k).trim(), code: raw.slice(k + MARK.length) };
    const j = raw.search(/Sim\.create\s*\(/);
    if (j >= 0) return { reply: raw.slice(0, j).trim(), code: raw.slice(j) };
    return { reply: raw.trim(), code: null };
  }
  function cleanCode(s) {
    return s.replace(/^\s*```(?:js|javascript)?\s*/i, "").replace(/```\s*$/, "").trim();
  }

  function mount(code) {
    const o = location.origin;
    const safe = (s) => s.replace(/<\/script/gi, "<\\/script");
    const map = JSON.stringify({ imports: { three: `${o}/vendor/three/build/three.module.js`, "three/addons/": `${o}/vendor/three/examples/jsm/` } });
    $("sim").srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark">
<script>addEventListener("error", (e) => { window.__sceneFailed = true; parent.postMessage({ type: "simkit-error", message: e.message + (e.lineno ? " (line " + e.lineno + ")" : "") }, "*"); });<\/script>
<script>window.__scene = function () {\n${safe(code)}\n};<\/script>
<script type="importmap">${map}<\/script>
<script type="module" src="${o}/simkit3d.js"><\/script></head><body></body></html>`;
  }

  // Loader: a ball tossed on a random arc bounces to rest; old arcs fade out as dotted paths.
  const toss = (() => {
    const cv = $("toss"), ctx = cv.getContext("2d"), W = 280, H = 120, GY = H - 16, R = 6, G = 600, E = 0.5, X0 = 22, STEP = 1 / 120;
    const mint = "124,240,200", reduce = matchMedia("(prefers-reduced-motion: reduce)");
    let on = false, raf = 0, stopT = 0, prev = 0, acc = 0, b, path = [], ghosts = [], rings = [];
    function launch(deg = 52 + Math.random() * 18, range = 90 + Math.random() * 25) {
      const a = deg * Math.PI / 180, v = Math.sqrt(range * G / Math.sin(2 * a));
      b = { x: X0, y: GY - R, vx: v * Math.cos(a), vy: -v * Math.sin(a), hops: 0, rest: 0 };
      path = [[b.x, b.y]];
    }
    function step(dt) {
      if (b.hops >= 3) {
        b.vx *= Math.exp(-8 * dt); b.x += b.vx * dt; b.rest += dt;
        if (b.rest > 0.35) { ghosts.push({ pts: path, life: 1 }); launch(); return; }
      } else {
        b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.y >= GY - R) { b.y = GY - R; b.vy *= -E; b.hops++; rings.push({ x: b.x, t: 0 }); }
      }
      path.push([b.x, b.y]);
    }
    function line(pts, style) {
      ctx.strokeStyle = style; ctx.beginPath(); ctx.moveTo(...pts[0]);
      for (const p of pts) ctx.lineTo(...p);
      ctx.stroke();
    }
    function draw(dt) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#2e2e2e"; ctx.fillRect(8, GY, W - 16, 1);
      ctx.fillStyle = "#262626"; for (let x = 8; x <= W - 8; x += 24) ctx.fillRect(x, GY + 1, 1, 4);
      ctx.lineWidth = 1; ctx.setLineDash([2, 5]);
      ghosts = ghosts.filter((g) => (g.life -= dt / 2.4) > 0);
      for (const g of ghosts) line(g.pts, `rgba(${mint},${0.3 * g.life})`);
      ctx.setLineDash([]);
      line(path, `rgba(${mint},.14)`);
      ctx.lineWidth = 2;
      const n = Math.min(36, path.length - 1), s = path.length - n;
      for (let i = s; i < path.length; i++) {
        ctx.strokeStyle = `rgba(${mint},${0.9 * (i - s + 1) / n})`;
        ctx.beginPath(); ctx.moveTo(...path[i - 1]); ctx.lineTo(...path[i]); ctx.stroke();
      }
      ctx.lineWidth = 1;
      rings = rings.filter((r) => (r.t += dt / 0.5) < 1);
      for (const r of rings) {
        const rx = 3 + 18 * r.t;
        ctx.strokeStyle = `rgba(${mint},${0.6 * (1 - r.t) ** 2})`;
        ctx.beginPath(); ctx.ellipse(r.x, GY, rx, rx * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
      }
      const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 0.5, b.x, b.y, R);
      g.addColorStop(0, "#fff"); g.addColorStop(0.45, "#7cf0c8"); g.addColorStop(1, "#2f6f5c");
      ctx.globalAlpha = b.hops >= 3 ? Math.max(0, 1 - b.rest / 0.35) : 1;
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    function frame(now) {
      const dt = Math.min((now - prev) / 1000, 0.05); prev = now;
      for (acc += dt; acc >= STEP; acc -= STEP) step(STEP);
      draw(dt);
      raf = requestAnimationFrame(frame);
    }
    return {
      start() {
        clearTimeout(stopT);
        if (on) return;
        on = true; ghosts = []; rings = []; acc = 0;
        const d = devicePixelRatio || 1;
        cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
        cv.classList.toggle("calm", reduce.matches);
        launch(58, 100);
        if (reduce.matches) { while (b.hops < 3) step(STEP); rings = []; draw(0); return; }
        prev = performance.now(); raf = requestAnimationFrame(frame);
      },
      stop() {
        stopT = setTimeout(() => { on = false; cancelAnimationFrame(raf); raf = 0; }, 450);
      },
    };
  })();

  async function ask(message, opts = {}) {
    busy = true; $("send").disabled = true;
    const out = bubble("model", "");
    lastModel = out;
    const t0 = performance.now();
    let raw = "", cached = false;
    const loading = (on) => { $("loader").classList.toggle("off", !on); $("sim").classList.toggle("fade", on); on ? toss.start() : toss.stop(); };
    if (!scene) loading(true);
    const tick = setInterval(() => {
      const sec = `${((performance.now() - t0) / 1000).toFixed(0)}s`;
      out.meta.textContent = sec; $("loadtime").textContent = sec;
    }, 200);
    try {
      const res = await fetch("/api/sim", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image, text: problem, scene, chat, message }),
      });
      if (!res.ok) throw new Error(await res.text());
      cached = res.headers.get("X-Cache") === "hit";
      const reader = res.body.getReader(), dec = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        raw += dec.decode(value, { stream: true });
        const { reply, code } = split(raw);
        setReply(out.text, reply);
        if (code) loading(true);
        $("thread").scrollTop = $("thread").scrollHeight;
      }
      const err = /<!--ERROR (.*)-->$/s.exec(raw);
      if (err) throw new Error(err[1]);
      const { reply, code } = split(raw);
      setReply(out.text, reply || "Built.");
      if (message) chat.push({ role: "user", text: message });
      chat.push({ role: "model", text: reply });
      if (code) {
        scene = cleanCode(code);
        if (!opts.fix) fixes = 0;
        mount(scene);
        $("code").disabled = false;
      }
      clearInterval(tick);
      out.meta.textContent = `${((performance.now() - t0) / 1000).toFixed(1)}s` + (cached ? " · cached" : "");
    } catch (e) {
      clearInterval(tick);
      out.meta.textContent = "✗ " + e.message;
    } finally {
      loading(false);
      busy = false; $("send").disabled = false;
    }
  }

  window.addEventListener("message", (e) => {
    if (e.source !== $("sim").contentWindow || !e.data) return;
    if (e.data.type === "simkit-error") {
      if (busy || fixes >= MAX_FIXES) return;
      fixes++;
      bubble("sys", `✗ ${e.data.message} → fixing`);
      ask(`The simulation crashed with this error: ${e.data.message}. Fix it and return the full scene.`, { fix: true });
    }
  });

  function start(text) {
    problem = text;
    setStarted(true);
    bubble("user", problem, image);
    chat.push({ role: "user", text: problem || "(photo)" });
    ask(null);
  }

  function grow() {
    const t = $("msg");
    t.style.height = "auto";
    t.style.height = t.scrollHeight + "px";
  }

  function send() {
    const m = $("msg").value.trim();
    if (busy || (!m && (started || !image))) return;
    $("msg").value = ""; grow();
    if (!started) return start(m);
    bubble("user", m);
    ask(m);
  }
  $("send").onclick = send;
  $("msg").oninput = grow;
  $("msg").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };

  $("new").onclick = () => {
    if (busy) return;
    problem = ""; scene = ""; chat = []; fixes = 0; lastModel = null;
    setImage(null); $("thread").innerHTML = ""; $("msg").value = ""; $("file").value = ""; grow();
    $("sim").removeAttribute("srcdoc"); $("code").disabled = true;
    setStarted(false);
  };

  $("code").onclick = () => {
    const w = window.open();
    w.document.body.style.cssText = "background:#0a0a0a;color:#ededed;margin:0";
    w.document.body.innerHTML = "<pre style='padding:20px;font:12px/1.5 ui-monospace,Menlo,monospace'></pre>";
    w.document.querySelector("pre").textContent = scene;
  };
</script>
</body>
</html>
